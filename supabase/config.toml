# https://supabase.com/docs/guides/local-development/cli/config
# Wird von der Supabase-CLI und der GitHub-Integration ausgelesen.
project_id = "promotionshub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Magic-Link nutzen — kein Passwort nötig.
[auth.email.template.magic_link]
subject = "Dein Anmelde-Link für PromotionsHub"
content_path = "./templates/magic-link.html"

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
