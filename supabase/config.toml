# https://supabase.com/docs/guides/local-development/cli/config
# Wird von der Supabase-CLI und der GitHub-Integration ausgelesen.
# Letztes Re-Sync: 2026-05-28 (Bootstrap-Daten gelöscht via Migration 6).
project_id = "promotionshub"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Vector-Buckets sind ein Paid-Feature — explizit aus, sonst will
# `supabase config push` sie aktivieren und scheitert mit 402.
[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "https://promotionshub.de"
additional_redirect_urls = [
  "https://promotionshub.de/**",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Magic-Link nutzt vorerst das Default-Template von Supabase.
# Sobald wir ein eigenes Mail-Design haben, wieder aktivieren:
# [auth.email.template.magic_link]
# subject = "Dein Anmelde-Link für PromotionsHub"
# content_path = "./templates/magic-link.html"

# Eigenes SMTP via Resend — umgeht das 2-Mails/h-Limit des
# Supabase-Default-Versands. Passwort = Resend-API-Key, kommt aus
# der Env (lokal: .env.local, config push liest die Shell-Env).
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(SMTP_PASS)"
admin_email = "kontakt@promotionshub.de"
sender_name = "PromotionsHub"

# Default bleibt auch mit eigenem SMTP bei 2 Mails/h — explizit anheben.
# Resend-Free erlaubt 3.000/Monat ≈ 100/Tag; 30/h ist dafür ein sicherer Wert.
[auth.rate_limit]
email_sent = 30

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
